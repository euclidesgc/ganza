name: CI

# A cancela roda no servidor: o PR de um agente passa pela mesma régua que o de
# um humano. Verde aqui é pré-requisito de merge em develop/main.
on:
  # PR empilhado aponta para a branch de suporte de baixo, não para develop. Sem
  # os prefixos abaixo, só o PR do fundo da pilha passaria pela régua. A lista
  # cobre TODO prefixo que pode virar base de pilha, não só os do GitFlow.
  pull_request:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'release/**'
      - 'docs/**'
      - 'chore/**'
  push:
    branches: [develop, main]

# O paths-filter consulta a API de pull requests para saber o que mudou; sem
# esta permissão o job morre com "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

# Monorepo: cada parte só roda quando muda. Mexer no app Flutter não tem por que
# validar as Edge Functions, e o runner não é infinito. O job `changes` decide e
# os outros o consultam. O `ci.yml` entra em todos os filtros de propósito —
# mexer na régua tem de revalidar tudo.
jobs:
  changes:
    name: O que mudou?
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filtro.outputs.app }}
      functions: ${{ steps.filtro.outputs.functions }}
      migrations: ${{ steps.filtro.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4

      # Job duplicado passa em parser YAML e é recusado pelo GitHub sem gerar
      # log. Validar aqui é a rede: o hook de pre-commit já barra localmente.
      - name: Workflows são válidos
        run: bash scripts/validar-workflows.sh

      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            app:
              - 'app/**'
              - 'scripts/gates_guard.sh'
              - '.github/workflows/ci.yml'
            functions:
              - 'supabase/functions/**'
              - '.github/workflows/ci.yml'
            migrations:
              - 'supabase/migrations/**'
              - 'supabase/ci-bootstrap.sql'
              - '.github/workflows/ci.yml'

  app:
    name: App — format + analyze + gates + testes
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # O app pode ainda não existir numa fase inicial: o job se pula em vez de
      # falhar. CI cronicamente vermelha ensina a ignorar a CI.
      - name: O app já existe?
        id: check
        working-directory: .
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::app/ ainda não existe — job pulado."
          fi

      # Versão fixa (não `channel: stable` solto): o formatter do Dart muda de
      # release e `stable` flutuaria para o Flutter mais novo, quebrando o gate
      # de format. Casa com o `.puro.json` do repo — os dois andam juntos.
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.existe == 'true'
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Dependências
        if: steps.check.outputs.existe == 'true'
        run: flutter pub get

      - name: Formatação
        if: steps.check.outputs.existe == 'true'
        run: dart format --output=none --set-exit-if-changed .

      - name: Análise estática
        if: steps.check.outputs.existe == 'true'
        run: flutter analyze

      # Fora da condição de propósito: o guard-script já sai limpo sozinho
      # quando não há app, e assim não corre risco de ser esquecido.
      - name: Gates de qualidade (guard-script)
        working-directory: .
        run: bash scripts/gates_guard.sh

      - name: Testes
        if: steps.check.outputs.existe == 'true'
        run: flutter test -r compact

  functions:
    name: Edge Functions — fmt + lint + tipos + testes
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Formatação
        run: deno fmt --check

      - name: Lint
        run: deno lint

      # Sem etapa de compilação, `deno check` é onde erro de tipo aparece antes
      # de virar 500 em produção.
      - name: Tipos
        run: deno task check

      - name: Testes
        run: deno task test

  migrations:
    name: Banco — migrations aplicam limpo e RLS está ligada
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `services:` não deixa passar argumentos ao processo do Postgres, e
      # pg_cron precisa estar em shared_preload_libraries. Daí o docker run.
      # A imagem é a MESMA de produção: testar contra `postgres:15` puro
      # validaria um banco que não é o nosso.
      #
      # Senha aleatória e nenhuma porta publicada: tudo fala por `docker exec`.
      - name: Subir o Postgres do Supabase
        run: |
          docker run -d --name pg \
            -e POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
            supabase/postgres:15.8.1.085 \
            postgres -c shared_preload_libraries=pg_cron,pg_net -c cron.database_name=postgres
          for i in $(seq 1 60); do
            docker exec pg pg_isready -U postgres -q && break
            sleep 2
          done
          docker exec pg pg_isready -U postgres

      # Quem cria `auth.users` e `auth.uid()` no ambiente real é o GoTrue, que
      # não roda aqui. O bootstrap monta o mínimo e nunca é aplicado em ambiente
      # real. Roda como supabase_admin: o schema `auth` da imagem pertence ao
      # supabase_auth_admin e o usuário `postgres` não escreve nele.
      - name: Bootstrap do schema auth (só CI)
        run: docker exec -i pg psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -q < supabase/ci-bootstrap.sql

      # O valor da migration está em aplicar do zero, na ordem, num banco vazio
      # — é o único ensaio do que vai acontecer em produção.
      - name: Aplicar migrations em ordem
        run: |
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then echo "nenhuma migration ainda"; exit 0; fi
          for f in "${files[@]}"; do
            echo "→ $f"
            docker exec -i pg psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -q < "$f"
          done

      # Tabela sem RLS é a falha que não dá erro nem no deploy nem no teste
      # manual: tudo funciona, e o dado fica exposto.
      - name: Toda tabela de aplicação tem RLS ligada
        run: |
          sem_rls=$(docker exec pg psql -U supabase_admin -d postgres -tAc "
            select coalesce(string_agg(tablename, ', '), '')
            from pg_tables
            where schemaname = 'public' and rowsecurity = false")
          if [ -n "$sem_rls" ]; then
            echo "✗ tabelas sem RLS: $sem_rls"
            exit 1
          fi
          echo "✓ todas as tabelas de public têm RLS"

      # RLS ligada sem política nenhuma bloqueia tudo em silêncio — parece
      # segura e o app simplesmente não lê nada. As duas coisas andam juntas.
      - name: Toda tabela com RLS tem política
        run: |
          sem_policy=$(docker exec pg psql -U supabase_admin -d postgres -tAc "
            select coalesce(string_agg(t.tablename, ', '), '')
            from pg_tables t
            where t.schemaname = 'public'
              and not exists (
                select 1 from pg_policies p
                where p.schemaname = t.schemaname and p.tablename = t.tablename)")
          if [ -n "$sem_policy" ]; then
            echo "✗ tabelas com RLS mas sem política: $sem_policy"
            exit 1
          fi
          echo "✓ todas as tabelas de public têm política"
