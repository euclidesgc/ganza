name: CI

# A cancela roda no servidor: o PR de um agente passa pela mesma régua que o de
# um humano. Verde aqui é pré-requisito de merge em develop/main.
on:
  # PR empilhado (stacked PR) aponta para a branch de suporte de baixo, não para
  # develop. Sem os prefixos abaixo, só o PR do fundo da pilha passaria pela
  # régua e os do meio subiriam sem CI — o auto-deploy do Coolify dispara no
  # push sem consultar o CI. A lista precisa cobrir TODO prefixo que pode virar
  # base de pilha, não só os do GitFlow: prefixo novo em uso como base entra
  # aqui no mesmo PR.
  pull_request:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'release/**'
      - 'docs/**'
      - 'chore/**'
  push:
    branches: [develop, main]

# Monorepo: cada job roda só quando a sua parte muda. Mexer no app Flutter não
# tem por que rebuildar o backend, e o runner não é infinito. O job `changes`
# decide, e os outros o consultam.
#
# Durante a Fase 0 o repositório ainda pode não ter `app/` ou `backend/`. Além
# do filtro por caminho, cada job confere se o diretório existe e se PULA em vez
# de falhar: CI cronicamente vermelha ensina a ignorar a CI, e aí ela deixa de
# ser cancela.
jobs:
  changes:
    name: O que mudou?
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filtro.outputs.app }}
      backend: ${{ steps.filtro.outputs.backend }}
      migrations: ${{ steps.filtro.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            app:
              - 'app/**'
              - 'scripts/gates_guard.sh'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            migrations:
              - 'supabase/**'
              - '.github/workflows/ci.yml'

  app:
    name: App — format + analyze + gates + testes
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: O app já existe?
        id: check
        working-directory: .
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::app/ ainda não existe (Fase 0) — job pulado."
          fi

      # Versão fixa (não `channel: stable` solto): o formatter do Dart muda de
      # release e `stable` flutuaria para o Flutter mais novo, quebrando o gate
      # de format a cada release. Casa com o `.puro.json` do repo — os dois
      # precisam andar juntos, senão o dev formata numa versão e a CI cobra outra.
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.existe == 'true'
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Dependências
        if: steps.check.outputs.existe == 'true'
        run: flutter pub get

      - name: Formatação
        if: steps.check.outputs.existe == 'true'
        run: dart format --output=none --set-exit-if-changed .

      - name: Análise estática
        if: steps.check.outputs.existe == 'true'
        run: flutter analyze

      # O guard-script roda mesmo sem o app: ele próprio detecta a ausência de
      # `app/lib` e sai limpo. Deixá-lo fora do `if` garante que ele não fique
      # esquecido quando o app nascer.
      - name: Gates de qualidade (guard-script)
        working-directory: .
        run: bash scripts/gates_guard.sh

      - name: Testes
        if: steps.check.outputs.existe == 'true'
        run: flutter test -r compact

  backend:
    name: Backend — lint + build + testes
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: O backend já existe?
        id: check
        working-directory: .
        run: |
          if [ -f backend/package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/ ainda não existe (Fase 0) — job pulado."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.existe == 'true'
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        if: steps.check.outputs.existe == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Dependências
        if: steps.check.outputs.existe == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.check.outputs.existe == 'true'
        run: pnpm lint

      - name: Build
        if: steps.check.outputs.existe == 'true'
        run: pnpm build

      - name: Testes
        if: steps.check.outputs.existe == 'true'
        run: pnpm test

  migrations:
    name: Banco — migrations aplicam limpo e RLS está ligada
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `services:` não deixa passar argumentos ao processo do Postgres, e
      # pg_cron precisa estar em shared_preload_libraries para ser criado.
      # Daí o docker run explícito. A imagem é a MESMA de produção: testar
      # contra `postgres:15` puro validaria um banco que não é o nosso —
      # pg_cron, pg_net e supabase_vault nem existem lá.
      # Senha aleatória e nenhuma porta publicada: tudo aqui fala com o banco
      # por `docker exec`, então não há motivo para existir credencial literal
      # no arquivo nem 5432 aberto no runner.
      - name: Subir o Postgres do Supabase
        run: |
          docker run -d --name pg \
            -e POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
            supabase/postgres:15.8.1.085 \
            postgres -c shared_preload_libraries=pg_cron,pg_net -c cron.database_name=postgres
          for i in $(seq 1 60); do
            docker exec pg pg_isready -U postgres -q && break
            sleep 2
          done
          docker exec pg pg_isready -U postgres

      # Quem cria `auth.users` e `auth.uid()` no ambiente real é o GoTrue, que
      # não roda aqui. O bootstrap monta o mínimo para as migrations poderem
      # referenciá-los — e não é aplicado em nenhum ambiente real.
      - name: Bootstrap do schema auth (só CI)
        run: docker exec -i pg psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -q < supabase/ci-bootstrap.sql

      # O valor da migration está em aplicar do zero, na ordem, num banco vazio
      # — é o único ensaio do que vai acontecer em produção.
      - name: Aplicar migrations em ordem
        run: |
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then echo "nenhuma migration ainda"; exit 0; fi
          for f in "${files[@]}"; do
            echo "→ $f"
            docker exec -i pg psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -q < "$f"
          done

      # Tabela sem RLS é a falha que não dá erro nem no deploy nem no teste
      # manual: tudo funciona, e o dado fica exposto. Por isso é gate de CI.
      - name: Toda tabela de aplicação tem RLS ligada
        run: |
          sem_rls=$(docker exec pg psql -U supabase_admin -d postgres -tAc "
            select coalesce(string_agg(tablename, ', '), '')
            from pg_tables
            where schemaname = 'public' and rowsecurity = false")
          if [ -n "$sem_rls" ]; then
            echo "✗ tabelas sem RLS: $sem_rls"
            exit 1
          fi
          echo "✓ todas as tabelas de public têm RLS"

      # RLS ligada sem política nenhuma bloqueia tudo em silêncio — parece
      # seguro e o app simplesmente não lê nada. As duas coisas andam juntas.
      - name: Toda tabela com RLS tem política
        run: |
          sem_policy=$(docker exec pg psql -U supabase_admin -d postgres -tAc "
            select coalesce(string_agg(t.tablename, ', '), '')
            from pg_tables t
            where t.schemaname = 'public'
              and not exists (
                select 1 from pg_policies p
                where p.schemaname = t.schemaname and p.tablename = t.tablename)")
          if [ -n "$sem_policy" ]; then
            echo "✗ tabelas com RLS mas sem política: $sem_policy"
            exit 1
          fi
          echo "✓ todas as tabelas de public têm política"
