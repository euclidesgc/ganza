_format_version: '3.0'
_transform: true

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        paths: [/auth/v1]
        strip_path: true
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        paths: [/rest/v1]
        strip_path: true
  - name: functions-v1
    url: http://functions:9000/
    routes:
      - name: functions-v1-route
        paths: [/functions/v1]
        strip_path: true
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-route
        paths: [/storage/v1]
        strip_path: true
