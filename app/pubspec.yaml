name: ganza
description: "Ganza - assistente pessoal de registro"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  bloc: ^9.0.1
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  fpdart: ^1.1.1
  get_it: ^8.2.0
  go_router: ^16.2.4
  http: ^1.6.0
  intl: ^0.20.2
  record: ^7.1.1
  supabase_flutter: ^2.10.1
  zard: ^0.0.16
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  patrol: ^4.9.0

patrol:
  app_name: Ganzá dev
  flavor: dev
  test_directory: patrol_test
  android:
    package_name: br.com.ganza.ganza.dev

flutter:
  uses-material-design: true

  # Licenças OFL das fontes abaixo — acompanham o app na distribuição
  # (exigência da SIL Open Font License).
  assets:
    - assets/fonts/licenses/

  # Fraunces e IBM Plex Sans são variable fonts: um único arquivo cobre toda
  # a faixa de peso. Um asset por família — nada de repetir `weight:` para
  # cada peso, quem varia o traço é `FontVariation` em core/theme.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans.ttf
    - family: RemixIcon
      fonts:
        - asset: assets/fonts/remixicon.ttf
